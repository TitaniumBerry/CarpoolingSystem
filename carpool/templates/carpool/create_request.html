{% extends "carpool/base.html" %}
{% block title %}Request Carpool{% endblock %}
{% block content %}
    <h2>Request a Carpool</h2>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Pickup Node</label><br>
        <select name="pickup_node">
            {% for node in nodes %}
                <option value="{{ node.id }}">{{ node.name }}</option>
            {% endfor %}
        </select><br><br>
        <label>Dropoff Node</label><br>
        <select name="dropoff_node">
            {% for node in nodes %}
                <option value="{{ node.id }}">{{ node.name }}</option>
            {% endfor %}
        </select><br><br>
        <button type="submit">Submit Request</button>
    </form>
{% endblock %}
