{% extends "carpool/base.html" %}
{% block title %}Request Carpool — RideShare{% endblock %}
{% block content %}

<div style="max-width:480px; margin:0 auto;">
    <div class="page-header">
        <h2>Request a Carpool</h2>
        <p>Tell us where you're going and we'll match you with a driver</p>
    </div>

    {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.8rem;">
                <div class="form-group" style="margin:0;">
                    <label>📍 Pickup</label>
                    <select name="pickup_node">
                        {% for node in nodes %}
                            <option value="{{ node.id }}">{{ node.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="margin:0;">
                    <label>🏁 Dropoff</label>
                    <select name="dropoff_node">
                        {% for node in nodes %}
                            <option value="{{ node.id }}">{{ node.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                📍 Submit Request
            </button>
        </form>
    </div>
</div>

{% endblock %}
