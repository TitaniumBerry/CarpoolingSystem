{% extends "carpool/base.html" %}
{% block title %}Create Trip{% endblock %}
{% block content %}
    <h2>Publish a New Trip</h2>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Start Node</label><br>
        <select name="start_node">
            {% for node in nodes %}
                <option value="{{ node.id }}">{{ node.name }}</option>
            {% endfor %}
        </select><br><br>

        <label>End Node</label><br>
        <select name="end_node">
            {% for node in nodes %}
                <option value="{{ node.id }}">{{ node.name }}</option>
            {% endfor %}
        </select><br><br>

        <label>Max Passengers</label><br>
        <input type="number" name="max_passengers" value="3" min="1" max="10"><br><br>

        <button type="submit">Publish Trip</button>
    </form>
{% endblock %}
