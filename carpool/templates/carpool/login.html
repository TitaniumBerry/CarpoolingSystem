{% extends "carpool/base.html" %}
{% block title %}Login — RideShare{% endblock %}
{% block content %}

<div style="max-width:420px; margin:3rem auto;">
    <div class="page-header" style="text-align:center; margin-bottom:2rem;">
        <div style="font-size:2.5rem; margin-bottom:1rem;">🚗</div>
        <h2>Welcome back</h2>
        <p>Sign in to your RideShare account</p>
    </div>

    {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" autofocus>
            </div>
            <div class="form-group" style="margin-bottom:1.8rem;">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                Sign In →
            </button>
        </form>

        <div style="display:flex; align-items:center; gap:1rem; margin:1.5rem 0;">
            <hr class="divider" style="flex:1; margin:0;">
            <span style="font-size:0.8rem; color:var(--text-dim);">or</span>
            <hr class="divider" style="flex:1; margin:0;">
        </div>

        <a href="/accounts/google/login/" class="btn btn-ghost" style="width:100%; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/><path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z" fill="#34A853"/><path d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z" fill="#FBBC05"/><path d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z" fill="#EA4335"/></svg>
            Continue with Google
        </a>
    </div>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.88rem; color:var(--text-muted);">
        Don't have an account? <a href="/signup" style="color:var(--accent); text-decoration:none; font-weight:600;">Sign up</a>
    </p>
</div>

{% endblock %}
