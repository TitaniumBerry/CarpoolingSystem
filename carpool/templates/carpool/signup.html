{% extends "carpool/base.html" %}
{% block title %}Sign Up — RideShare{% endblock %}
{% block content %}

<div style="max-width:420px; margin:3rem auto;">
    <div class="page-header" style="text-align:center; margin-bottom:2rem;">
        <div style="font-size:2.5rem; margin-bottom:1rem;">✨</div>
        <h2>Create account</h2>
        <p>Join RideShare and start your journey</p>
    </div>

    {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a strong password">
            </div>
            <div class="form-group" style="margin-bottom:1.8rem;">
                <label>I want to</label>
                <select name="role">
                    <option value="passenger">🧍 Ride as a Passenger</option>
                    <option value="driver">🚗 Drive as a Driver</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                Create Account →
            </button>
        </form>
    </div>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.88rem; color:var(--text-muted);">
        Already have an account? <a href="/login" style="color:var(--accent); text-decoration:none; font-weight:600;">Sign in</a>
    </p>
</div>

{% endblock %}
